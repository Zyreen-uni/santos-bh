<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option C Register</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1670B8}a:hover{color:#0A2A5E}
</style>
</helmet>
<div style="font-family: 'Plus Jakarta Sans', sans-serif; color: #14213D; background: #EEF3F9; min-height: 900px; display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box">
  <form style="width: 100%; max-width: 580px; background: #FFFFFF; border-radius: 28px; padding: 40px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <img src="santos-logo.png" alt="Santos Boarding House" style="height: 80px; width: auto; align-self: center">
    <nav aria-label="Account" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #EEF3F9; border-radius: 999px; padding: 5px">
      <a href="Main.dc.html" style="text-align: center; text-decoration: none; font-weight: 600; font-size: 15px; color: #46536D; border-radius: 999px; padding: 12px">Login</a>
      <a href="C-Register.dc.html" aria-current="page" style="text-align: center; text-decoration: none; font-weight: 700; font-size: 15px; color: #FFFFFF; background: #0A2A5E; border-radius: 999px; padding: 12px">Register</a>
    </nav>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-weight: 800; font-size: 26px; color: #0A2A5E">Create your tenant account</h1>
      <p style="margin: 0; font-size: 15px; color: #46536D">The owner assigns your room after you register.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px; grid-column: span 2">
        <label for="cr-name" style="font-weight: 600; font-size: 14px; color: #2C3A55">Full Name</label>
        <input id="cr-name" type="text" value="Maria Reyes" style="font-family: inherit; font-size: 16px; padding: 14px 16px; background: #F4F7FB; border: 1px solid #C5D1E0; border-radius: 14px; color: #14213D">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cr-user" style="font-weight: 600; font-size: 14px; color: #2C3A55">Username</label>
        <input id="cr-user" type="text" value="maria.reyes" style="font-family: inherit; font-size: 16px; padding: 14px 16px; background: #F4F7FB; border: 1px solid #C5D1E0; border-radius: 14px; color: #14213D">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cr-contact" style="font-weight: 600; font-size: 14px; color: #2C3A55">Contact #</label>
        <input id="cr-contact" type="tel" value="0917 123 4567" style="font-family: inherit; font-size: 16px; padding: 14px 16px; background: #F4F7FB; border: 1px solid #C5D1E0; border-radius: 14px; color: #14213D">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; grid-column: span 2">
        <label for="cr-email" style="font-weight: 600; font-size: 14px; color: #2C3A55">Email</label>
        <input id="cr-email" type="email" value="maria.reyes@gmail.com" style="font-family: inherit; font-size: 16px; padding: 14px 16px; background: #F4F7FB; border: 1px solid #C5D1E0; border-radius: 14px; color: #14213D">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cr-pass" style="font-weight: 600; font-size: 14px; color: #2C3A55">Password</label>
        <input id="cr-pass" type="password" value="password1" style="font-family: inherit; font-size: 16px; padding: 14px 16px; background: #F4F7FB; border: 1px solid #C5D1E0; border-radius: 14px; color: #14213D">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cr-pass2" style="font-weight: 600; font-size: 14px; color: #2C3A55">Confirm Password</label>
        <input id="cr-pass2" type="password" value="password1" style="font-family: inherit; font-size: 16px; padding: 14px 16px; background: #F4F7FB; border: 1px solid #C5D1E0; border-radius: 14px; color: #14213D">
      </div>
    </div>
    <button type="button" style="font-family: inherit; font-weight: 700; font-size: 17px; color: #FFFFFF; background: #1670B8; border: 0; border-radius: 999px; padding: 16px; cursor: pointer">Register</button>
  </form>
</div>
</x-dc>

  renderVals() {

  }
}
</script>
</body>
</html>
